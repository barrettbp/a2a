[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @snapwork/web build"
  publish = "apps/web/dist"

# Set VITE_API_URL (the public Railway URL of the API) in the Netlify site environment variables.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # connect-src must list the API origin. *.up.railway.app covers Railway's default domain.
    # If you use your own domain for the API, add it here (and nowhere else).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.up.railway.app; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
